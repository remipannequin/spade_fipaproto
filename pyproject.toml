[build-system]
 requires = ["hatchling >= 1.26"]
 build-backend = "hatchling.build"

[project]
 name = "spade_fipaproto"
 packages = ["spade_fipaproto"]
 description = "Implementation with spade of some FIPA interaction protocols, such as FIPA-Request and FIPA-ContractNet"
 readme = "README.md"
 requires-python = ">=3.11"
 dependencies = [
    "spade>=4.1.2",
    "spade_pubsub"
 ]
  version="0.5.1"

[project.optional-dependencies]
  mqtt = ["spade_mqtt"]
  dev = [
    "black",
    "ruff"
  ]
  test = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio"
  ]

[tool.hatch.build.targets.sdist]
 ignore-vcs = false

[tool.ruff]
 line-length = 93

[tool.pytest.ini_options]
 testpaths = ["tests"]
 addopts = "-ra"

[tool.tox]
  env_list=["py311", "py312"]

[tool.tox.env_run_base]
  extras = ["test"]
  commands = [["pytest"]]
  package = "wheel"
